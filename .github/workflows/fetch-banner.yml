name: Fetch previous-site banner
on:
  push:
    paths:
      - '.github/workflows/fetch-banner.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download banner images from vesseclub.com
        run: |
          curl -fL --retry 3 -o app/public/assets/img/banner-anterior.jpg "https://vesseclub.com/cdn/shop/files/WhatsApp_Image_2025-07-03_at_16.15.13.jpg?v=1751926485&width=2800"
          curl -fL --retry 3 -o app/public/assets/img/banner-anterior-mobile.jpg "https://vesseclub.com/cdn/shop/files/Frame-4_4_d48df64a-0385-4c78-8010-e835611c5ea6.webp?v=1751927976&width=1200"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/img/banner-anterior.jpg app/public/assets/img/banner-anterior-mobile.jpg
          git commit -m "Add previous-site banner images"
          git push
