name: Fetch editorial image
on:
  push:
    paths:
      - '.github/workflows/fetch-editorial.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download editorial image
        run: |
          curl -fL --retry 3 -o app/public/assets/img/editorial-dt26-yoga.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3G9lfxJtcGPEHBzEOF3OsZDhybl/4fb87cc5-2009-497f-945f-7547ef707460.jpg"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/img/editorial-dt26-yoga.jpg
          git commit -m "Add DT26 yoga editorial image"
          git push
