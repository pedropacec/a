name: Import vesse-club site
on:
  push:
    paths:
      - '.github/workflows/import-vesse.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract site archive
        run: |
          curl -fL --retry 3 -o /tmp/vesse-club.tar.gz "https://d2ol7oe51mr4n9.cloudfront.net/user_3G9lfxJtcGPEHBzEOF3OsZDhybl/63c55f14-2936-4796-8409-f1bdf05c5598.gz"
          mkdir -p /tmp/vesse-club
          tar -xzf /tmp/vesse-club.tar.gz -C /tmp/vesse-club
          rm -rf /tmp/vesse-club/.git
          # GITHUB_TOKEN cannot push workflow files, so keep the site's
          # .github out of this repo (it stays in the Higgsfield repo)
          rsync -a --exclude='.github' /tmp/vesse-club/ ./
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import vesse-club site from Higgsfield"
          git push
