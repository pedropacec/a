name: Fetch DT dark-page assets
on:
  push:
    paths:
      - '.github/workflows/fetch-dt-assets.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          curl -fL --retry 3 -o app/public/assets/img/dt26-logo.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3G9lfxJtcGPEHBzEOF3OsZDhybl/a01b5915-c411-4a2e-9022-6e58ee971506.png"
          curl -fL --retry 3 -o app/public/assets/img/editorial-dt26-yoga.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3G9lfxJtcGPEHBzEOF3OsZDhybl/7f6f4d56-6743-4c78-b1f2-22fa0ed3f006.png"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/img/dt26-logo.png app/public/assets/img/editorial-dt26-yoga.png
          git commit -m "Add DT26 dark-page assets (logo cutout, transparent yoga)"
          git push
