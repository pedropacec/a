name: Fetch DT dark-page assets
on:
  push:
    paths:
      - '.github/workflows/fetch-dt-assets.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          curl -fL --retry 3 -o app/public/assets/img/dt26-logo.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3G9lfxJtcGPEHBzEOF3OsZDhybl/a6db1b5a-2570-4879-bae1-7a7b9f21ce7d.png"
          curl -fL --retry 3 -o app/public/assets/img/editorial-dt26-yoga.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3G9lfxJtcGPEHBzEOF3OsZDhybl/9b5aea76-473f-4873-9696-87566f18c0b8.png"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/img/dt26-logo.png app/public/assets/img/editorial-dt26-yoga.png
          git commit -m "Add DT26 dark-page assets (logo cutout, transparent yoga)"
          git push
