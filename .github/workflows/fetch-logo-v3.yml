name: Fetch DT logo v3
on:
  push:
    paths:
      - '.github/workflows/fetch-logo-v3.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download logo
        run: |
          curl -fL --retry 3 -o app/public/assets/img/dt26-logo.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3G9lfxJtcGPEHBzEOF3OsZDhybl/984cbf5a-af18-4338-b7ae-28695fd6461a.png"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/img/dt26-logo.png
          git commit -m "DT26 logo without tagline"
          git push
