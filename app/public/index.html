<!DOCTYPE html>
<!-- Porte Shopify (seção 9): templates/index.json + sections -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vèsse Club</title>
  <meta name="description" content="Vèsse Club: streetwear confeccionado em Belo Horizonte. Divine Therapy, a nova estação da casa — moletons, camisetas e conjuntos com entrega cortesia em todo o Brasil.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;450;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Vèsse Club",
    "url": "https://www.vesseclub.com/",
    "foundingDate": "2025",
    "founder": { "@type": "Person", "name": "Pedro" },
    "address": { "@type": "PostalAddress", "addressLocality": "Belo Horizonte", "addressRegion": "MG", "addressCountry": "BR" },
    "sameAs": ["https://www.instagram.com/vesseclub", "https://www.tiktok.com/@vesseclub"]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Vèsse Club",
    "url": "https://www.vesseclub.com/",
    "inLanguage": "pt-BR"
  }
  </script>
</head>
<!--
  BRIEF FOTOGRÁFICO — slots de foto com significado fixo:
  _01 packshot frente · _02 packshot costas · _04 macro do logo/estampa
  _06 on-model frente (vestindo a peça coordenada do conjunto)
  _07 on-model costas · _08 on-model lateral/detalhe
  _09 crop de peito com rosto meio cortado.
  Ordem única de galeria: 01 → 06 → 07 → 08 → 09 → 04 → 02.
  Masters futuros: 2400×3000 WebP.
-->
<body data-page="home" data-template="index" data-root="">
  <main>
    <!-- 3. Hero: o banner do site anterior (vesseclub.com), na proporção
         natural da foto — retrato no mobile, paisagem no desktop. O selo
         da estação leva à PÁGINA do drop, NUNCA à coleção. -->
    <section class="hero">
      <h1 class="sr-only">Vèsse Club — Divine Therapy</h1>
      <figure class="well well--hero" role="img"
        aria-label="Banner da campanha Vèsse — a foto de abertura do site anterior."
        title="Banner da campanha Vèsse — a foto de abertura do site anterior.">
        <span class="well__face" data-code="BANNER-VESSE" data-slot="HERO">
          <picture>
            <source media="(max-width: 699px)" srcset="assets/img/banner-anterior-mobile.jpg">
            <img src="assets/img/banner-anterior.jpg" alt="">
          </picture>
        </span>
      </figure>
      <a class="hero__season" href="pages/divine-therapy.html">Divine Therapy</a>
    </section>

    <div class="container">
      <!-- 4. Rail do drop — sem título e sem toggle (direção do Pedro). -->
      <section class="rail" id="rail-drop">
        <div class="rail__grid"></div>
      </section>

    </div>

    <!-- 5. VÍDEO de campanha (o vídeo real da home de vesseclub.com):
         FULL-BLEED de borda a borda, sem moldura e sem botão (direção
         do Pedro). Loop, mudo, sem controles. -->
    <section class="video-mod">
      <video class="video-mod__player" autoplay muted loop playsinline preload="metadata"
        aria-label="Vídeo de campanha da Vèsse: a peça no corpo, a noite, o movimento.">
        <source src="assets/video/campanha-dt26.mp4" type="video/mp4">
      </video>
      <figure class="well well--video" role="img"
        aria-label="Vídeo de campanha da Vèsse — slot do player."
        title="Vídeo de campanha da Vèsse — slot do player.">
        <span class="well__face" data-code="CAMPANHA-VIDEO" data-slot="V1"></span>
      </figure>
    </section>

    <div class="container">
      <!-- 6. Rail "New Arrivals" — ANTES da dupla de imagens (direção
           do Pedro). MESMO componente do módulo 4, reusado. -->
      <section class="rail">
        <div class="rail__head">
          <h2 class="display rail__title">New Arrivals</h2>
        </div>
        <div class="rail__grid" data-rail="new-arrivals"></div>
      </section>
    </div>

    <!-- 7. Par de imagens FULL-BLEED lado a lado: sem título, sem CTA,
         a tela preenchida pelas duas fotos. -->
    <section class="duo">
      <figure class="well well--duo" role="img"
        aria-label="A abertura da casa: modelo de óculos escuros na poltrona, tee Vèsse branca e champanhe na mão."
        title="A abertura da casa: modelo de óculos escuros na poltrona, tee Vèsse branca e champanhe na mão.">
        <span class="well__face" data-code="EDITORIAL-DUO" data-slot="S1">
          <img src="assets/img/duo-01.jpg" alt="" loading="lazy">
        </span>
      </figure>
      <figure class="well well--duo" role="img"
        aria-label="Costas da tee Vè'Maison — 71 Wet Dreams St., 'Cul-de-sac' — sobre o tapete persa da casa."
        title="Costas da tee Vè'Maison — 71 Wet Dreams St., 'Cul-de-sac' — sobre o tapete persa da casa.">
        <span class="well__face" data-code="EDITORIAL-DUO" data-slot="S2">
          <img src="assets/img/duo-02.webp" alt="" loading="lazy">
        </span>
      </figure>
    </section>
  </main>
  <!-- 8. Footer injetado por ui.js. O bloco do clube NÃO aparece aqui:
       convite só no rodapé (link) e no Vèsse World (direção do Pedro). -->
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
