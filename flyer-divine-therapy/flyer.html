<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Divine Therapy — flyer animado</title>
<style>
  @font-face { font-family:'Poppins';          font-weight:800; src:url('fonts/poppins-800.woff2') format('woff2'); }
  @font-face { font-family:'Inter';            font-weight:700; src:url('fonts/inter-700.woff2') format('woff2'); }
  @font-face { font-family:'Inter';            font-weight:800; src:url('fonts/inter-800.woff2') format('woff2'); }
  @font-face { font-family:'Archivo Narrow';   font-weight:700; src:url('fonts/archivonarrow-700.woff2') format('woff2'); }
  @font-face { font-family:'Playfair Display'; font-weight:700; src:url('fonts/playfair-700.woff2') format('woff2'); }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; }
  body { width:1080px; }

  /* page = área capturada (feed 1080x1350 / story 1080x1920) */
  .page { width:1080px; height:1350px; background:#000; overflow:hidden;
          display:flex; align-items:center; justify-content:center; position:relative; }
  body.story .page { height:1920px; }

  .stage-clip { width:1080px; height:1350px; position:relative; overflow:hidden; background:#000; }
  .stage { width:1080px; height:1350px; position:absolute; inset:0; transform-origin:50% 50%; }

  /* ---------- tipografia ---------- */
  .type { position:absolute; inset:0; color:#fff; z-index:3; }

  .title { position:absolute; left:52px; top:48px;
           font-family:'Poppins'; font-weight:800; font-size:197px; line-height:.93;
           letter-spacing:-.012em; white-space:nowrap;
           text-shadow:0 0 8px rgba(255,255,255,.55), 0 0 26px rgba(255,255,255,.28), 0 0 60px rgba(255,255,255,.14); }
  .title .l2 { display:block; }

  .date { position:absolute; left:56px; top:462px;
          font-family:'Inter'; font-weight:800; font-size:86px; line-height:1.06; letter-spacing:.012em;
          text-shadow:0 0 8px rgba(255,255,255,.5), 0 0 24px rgba(255,255,255,.22); }

  .right { position:absolute; right:56px; top:452px; text-align:right;
           text-shadow:0 0 7px rgba(255,255,255,.5), 0 0 20px rgba(255,255,255,.2); }
  .vesse { font-family:'Playfair Display'; font-weight:700; font-size:60px; letter-spacing:.02em; line-height:1; }
  .info  { margin-top:10px; font-family:'Archivo Narrow'; font-weight:700; font-size:34px;
           letter-spacing:.015em; line-height:1.18; }

  /* ---------- ilustração ---------- */
  .illo { position:absolute; left:0; top:520px; width:1080px; height:830px; z-index:2; }
  .illo svg { width:100%; height:100%; overflow:visible; }
  .illo { filter:
      drop-shadow(0 0 5px  rgba(255,255,255,.85))
      drop-shadow(0 0 16px rgba(255,255,255,.45))
      drop-shadow(0 0 42px rgba(255,255,255,.18)); }

  .stroke { fill:none; stroke:#fff; stroke-width:4.6; stroke-linecap:round; stroke-linejoin:round; }
  .thin   { stroke-width:3.4; }
  .thick  { stroke-width:5.6; }

  /* ---------- overlays ---------- */
  #grain { position:absolute; inset:0; z-index:6; pointer-events:none; opacity:.055;
           image-rendering:pixelated; mix-blend-mode:screen; width:100%; height:100%; }
  .vignette { position:absolute; inset:0; z-index:5; pointer-events:none;
              background:radial-gradient(130% 110% at 50% 42%, transparent 62%, rgba(0,0,0,.5) 100%); }
</style>
</head>
<body>
<div class="page">
 <div class="stage-clip">
  <div class="stage" id="stage">

    <div class="type">
      <h1 class="title" id="title">DIVINE<span class="l2" id="titleL2">THERAPY</span></h1>
      <div class="date">AUGUST<br>29TH</div>
      <div class="right">
        <div class="vesse">V&Egrave;SSE</div>
        <div class="info">APPOINTMENT 10PM / 5AM<br>FULL OPEN BAR</div>
      </div>
    </div>

    <div class="illo" id="illo">
      <svg viewBox="0 0 1080 830" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- fervura grossa + jitter fino = traço elétrico desenhado à mão -->
          <filter id="boil" x="-8%" y="-8%" width="116%" height="116%">
            <feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="1" result="n1"/>
            <feDisplacementMap in="SourceGraphic" in2="n1" scale="7" xChannelSelector="R" yChannelSelector="G" result="d1"/>
            <feTurbulence id="boilNoise2" type="fractalNoise" baseFrequency="0.09" numOctaves="1" seed="11" result="n2"/>
            <feDisplacementMap in="d1" in2="n2" scale="3" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <!-- eco: cópia deslocada a 38% = linha "traçada duas vezes" -->
          <filter id="echo" x="-8%" y="-8%" width="116%" height="116%">
            <feOffset in="SourceGraphic" dx="3.5" dy="-2.5" result="o"/>
            <feComponentTransfer in="o" result="of"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
            <feMerge><feMergeNode in="of"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <g filter="url(#boil)">
         <g filter="url(#echo)">

          <!-- ==================== fumaça ==================== -->
          <g id="gSmoke">
            <path id="smoke1" class="stroke thin" d="M 502,-18 C 514,-46 486,-68 500,-98 C 510,-120 498,-138 504,-156"/>
            <path id="smoke2" class="stroke thin" d="M 516,-24 C 532,-44 522,-68 538,-88 C 550,-104 546,-124 554,-140"/>
          </g>

          <!-- ==================== braço erguido com cigarro ==================== -->
          <g id="gArm">
            <!-- manga do casaco (dois traços) -->
            <path class="stroke thick" d="M 630,462 C 600,402 585,342 570,282 C 562,246 553,206 548,172"/>
            <path class="stroke thick" d="M 692,454 C 664,398 650,342 638,288 C 630,254 622,218 616,188"/>
            <!-- punho de pelo -->
            <path class="stroke" d="M 544,176 L 558,158 L 570,178 L 584,158 L 598,178 L 612,160 L 622,184"/>
            <!-- mão: punho fechado -->
            <path class="stroke" d="M 552,154 C 542,132 544,110 560,98 C 576,88 596,90 608,102 C 618,114 620,132 612,148"/>
            <!-- dois dedos estendidos juntos -->
            <path class="stroke" d="M 562,102 C 548,82 536,64 526,46"/>
            <path class="stroke" d="M 578,94 C 566,74 556,56 548,38"/>
            <path class="stroke thin" d="M 526,46 C 532,38 540,34 548,38"/>
            <!-- dedo dobrado sobre o punho -->
            <path class="stroke thin" d="M 590,92 C 590,82 594,75 601,73"/>
            <!-- cigarro saindo da ponta dos dedos -->
            <path class="stroke" d="M 536,40 L 504,-2"/>
            <path class="stroke" d="M 548,36 L 516,-6"/>
            <circle cx="508" cy="-6" r="6" fill="#fff" stroke="none"/>
          </g>

          <!-- ==================== cabeça ==================== -->
          <g id="gHead">
            <!-- cabelo: coroa de cachos -->
            <path class="stroke" d="M 700,205 C 688,175 702,145 730,133 C 724,111 744,92 770,92 C 778,68 810,58 834,70 C 858,54 892,63 903,88 C 928,86 947,106 942,130 C 963,141 968,168 953,187 C 966,203 961,228 944,237"/>
            <path class="stroke thin" d="M 738,140 C 748,127 766,123 778,129 M 796,104 C 808,94 826,94 836,102 M 862,100 C 876,94 892,100 898,112 M 914,136 C 926,134 936,142 938,154"/>
            <path class="stroke thin" d="M 722,186 C 714,170 720,152 734,144 M 936,175 C 948,179 954,191 950,203"/>
            <path class="stroke thin" d="M 706,215 C 698,203 700,189 710,180 M 948,215 C 958,209 966,197 964,185"/>
            <!-- rosto -->
            <path class="stroke" d="M 714,230 C 708,280 718,326 750,354 C 778,378 824,380 852,360 C 880,340 894,304 894,262"/>
            <!-- orelha esquerda -->
            <path class="stroke thin" d="M 708,252 C 698,248 692,258 698,270 C 702,278 710,280 714,274"/>
            <!-- óculos: sobrancelha grossa da armação -->
            <path class="stroke thick" d="M 714,220 C 744,215 776,213 806,215 M 824,214 C 852,210 882,208 910,210"/>
            <!-- óculos: lente esquerda -->
            <path class="stroke thick" d="M 716,222 L 794,217 C 802,217 806,221 806,229 L 802,271 C 801,279 796,283 788,283 L 732,279 C 724,279 719,274 718,266 Z"/>
            <!-- óculos: lente direita -->
            <path class="stroke thick" d="M 826,215 L 898,210 C 906,210 910,214 910,222 L 906,262 C 905,270 900,274 892,274 L 840,272 C 832,272 827,267 826,259 Z"/>
            <!-- ponte + haste -->
            <path class="stroke" d="M 806,245 C 812,241 820,241 826,243"/>
            <path class="stroke thin" d="M 910,230 L 932,224"/>
            <!-- reflexo duplo nas lentes -->
            <path class="stroke thin" d="M 738,267 L 772,229 M 750,272 L 780,236 M 848,258 L 878,224 M 860,264 L 886,232"/>
            <!-- nariz -->
            <path class="stroke thin" d="M 812,288 C 810,300 806,308 800,314"/>
            <!-- bigode retrô, pontas curvando para cima -->
            <path class="stroke" d="M 808,324 C 798,314 782,314 772,322 C 766,327 758,326 754,318"/>
            <path class="stroke" d="M 812,324 C 822,314 838,314 848,322 C 854,327 862,326 866,318"/>
            <!-- boca reta, discreta -->
            <path class="stroke thin" d="M 802,352 L 828,349"/>
            <!-- pescoço -->
            <path class="stroke thin" d="M 766,380 C 768,396 772,410 780,422"/>
            <path class="stroke thin" d="M 848,368 C 850,388 852,404 850,420"/>
          </g>

          <!-- ==================== corpo: gola de pelo, casaco, braço de apoio ==================== -->
          <g id="gBodyStatic">
            <!-- gola de pelo (duas fileiras de zigue-zague) -->
            <path class="stroke" d="M 640,455 L 668,420 L 692,452 L 718,418 L 744,450 L 772,416 L 800,448 L 828,416 L 854,448 L 882,418 L 908,452"/>
            <path class="stroke" d="M 648,500 L 674,468 L 698,500 L 724,466 L 750,498 L 778,464 L 806,496 L 834,464 L 860,496 L 888,468 L 912,500"/>
            <!-- borda esquerda do casaco caindo + pelo na borda -->
            <path class="stroke thick" d="M 654,502 C 636,560 628,620 636,678"/>
            <path class="stroke" d="M 654,502 L 640,530 L 656,548 L 642,578 L 658,596 L 644,626 L 660,644 L 646,674"/>
            <!-- costas (lado direito) -->
            <path class="stroke thick" d="M 904,496 C 940,540 962,596 956,652"/>
            <!-- linha do colo ligando ao quadril -->
            <path class="stroke thick" d="M 636,678 C 700,704 780,706 848,684"/>
            <!-- dobras internas do casaco -->
            <path class="stroke thin" d="M 748,520 C 742,570 728,618 704,656"/>
            <path class="stroke thin" d="M 828,524 C 830,576 820,624 800,662"/>
            <!-- textura de pelo do casaco (tiques) -->
            <path class="stroke thin" d="M 700,560 l 10,-14 M 716,566 l 10,-14 M 732,572 l 10,-14"/>
            <path class="stroke thin" d="M 770,600 l 10,-14 M 786,606 l 10,-14"/>
            <path class="stroke thin" d="M 860,560 l 10,-14 M 876,566 l 10,-14"/>
            <!-- braço de apoio: ombro -> cotovelo -> mão no chão -->
            <path class="stroke thick" d="M 956,652 C 970,696 962,730 938,754"/>
            <path class="stroke" d="M 938,754 C 914,768 886,772 858,766"/>
            <!-- dedos da mão de apoio -->
            <path class="stroke thin" d="M 906,768 C 902,784 892,794 878,798"/>
            <path class="stroke thin" d="M 930,764 C 928,780 920,792 908,798"/>
            <path class="stroke thin" d="M 880,768 C 872,780 860,786 846,786"/>
            <!-- anéis -->
            <circle class="stroke thin" cx="896" cy="782" r="8" fill="none"/>
            <circle class="stroke thin" cx="922" cy="778" r="8" fill="none"/>
          </g>

          <!-- ==================== perna com joelho erguido ==================== -->
          <g id="gLegKnee">
            <!-- coxa até o joelho (bend suave) -->
            <path class="stroke thick" d="M 640,690 C 545,650 445,600 366,562"/>
            <!-- canela descendo do joelho -->
            <path class="stroke thick" d="M 366,562 C 322,584 286,614 260,652"/>
            <!-- bota pontuda -->
            <path class="stroke thick" d="M 262,648 C 230,636 188,630 150,636 C 116,641 88,652 70,664"/>
            <path class="stroke thick" d="M 70,664 C 108,678 156,682 200,678 C 236,675 264,678 284,672"/>
            <path class="stroke thin" d="M 208,680 L 212,700"/>
          </g>

          <!-- ==================== perna de baixo ==================== -->
          <g id="gLeg2">
            <path class="stroke thick" d="M 720,706 C 630,716 540,734 468,758"/>
            <path class="stroke" d="M 468,758 C 434,770 410,780 394,792"/>
            <!-- bota 2 -->
            <path class="stroke thick" d="M 394,790 C 360,782 320,782 284,790 C 250,797 224,806 206,816"/>
            <path class="stroke thick" d="M 206,816 C 246,826 292,827 332,820 C 360,815 382,804 396,800"/>
            <path class="stroke thin" d="M 336,822 L 340,838"/>
          </g>

          <!-- ==================== rosa ==================== -->
          <g id="gRose">
            <!-- caule -->
            <path class="stroke" d="M 480,776 C 430,762 385,748 345,740"/>
            <!-- folhas -->
            <path class="stroke thin" d="M 428,762 C 416,748 400,744 386,750 C 396,762 414,766 428,762 Z"/>
            <path class="stroke thin" d="M 390,750 C 384,734 372,726 358,728 C 362,742 376,750 390,750 Z"/>
            <!-- flor: espiral -->
            <path class="stroke" d="M 345,740 C 321,744 297,734 287,714 C 275,692 285,664 309,656 C 331,649 355,662 359,684 C 362,702 351,720 333,724 C 317,727 303,718 301,704 C 300,692 309,683 321,685 C 330,687 334,696 329,702 C 325,707 318,706 316,701"/>
          </g>

         </g>
        </g>
      </svg>
    </div>

    <div class="vignette"></div>
    <canvas id="grain" width="270" height="338"></canvas>
  </div>
 </div>
</div>

<script>
/* ============================================================
   Animação determinística — tudo é função do índice do frame.
   FPS=24, DUR=6s -> 144 frames, loop perfeito.
   ============================================================ */
const FPS = 24, DUR = 6, TOTAL = FPS * DUR;   // 144
const BOIL_FPS = 8;                            // "fervura" das linhas
const TICKS = DUR * BOIL_FPS;                  // 48 ticks por loop

const qs = new URLSearchParams(location.search);
if (qs.get('format') === 'story') document.body.classList.add('story');

const $ = id => document.getElementById(id);
const stage = $('stage'), illo = $('illo'), title = $('title');
const boilNoise = $('boilNoise'), boilNoise2 = $('boilNoise2');
const grain = $('grain'), gtx = grain.getContext('2d');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* padrões de "dança" (passos de 8fps, períodos que dividem 48 ticks) */
const armPat  = [0,-2,-4,-5.5,-4,-2,0,2,4,5.5,4,2];          // 12 ticks (1.5s)
const headPat = [0,1.6,3.2,1.6,0,-1.6,-3.2,-1.6];            // 8 ticks (1s)
const legPat  = [0,1,2,1,0,-1,-2,-1];                        // 8 ticks
const bobPat  = [0,1.5,3,1.5,0,-1.5,-3,-1.5];                // 8 ticks
const rosePat = [0,1.2,2.4,3,2.4,1.2,0,-1.2,-2.4,-3,-2.4,-1.2]; // 12 ticks
const handPat = [0,.8,1.6,.8,0,-.8,-1.6,-.8];                // 8 ticks

function rot(el,a,cx,cy,dx=0,dy=0){el.setAttribute('transform',`translate(${dx} ${dy}) rotate(${a} ${cx} ${cy})`);}

/* flicker de neon no título — envelope determinístico, periódico em 6s */
function titleAlpha(t){
  const hum = .97 + .03*Math.sin(2*Math.PI*t/2);
  if (t>=2.80 && t<2.86) return .38;
  if (t>=2.86 && t<2.92) return 1;
  if (t>=2.92 && t<3.00) return .55;
  if (t>=3.00 && t<3.04) return .85;
  return hum;
}

function renderFrame(i){
  const t = (i % TOTAL) / FPS;
  const tick = Math.floor(t * BOIL_FPS) % TICKS;

  /* fervura das linhas: sementes dos ruídos mudam a 8fps */
  boilNoise.setAttribute('seed', String(tick + 1));
  boilNoise2.setAttribute('seed', String((tick * 7 + 11) % 997));

  /* dança do personagem */
  rot($('gArm'),  armPat[tick % 12], 660, 455);
  rot($('gHead'), headPat[tick % 8], 800, 400);
  rot($('gLegKnee'), legPat[tick % 8], 650, 695);
  rot($('gLeg2'), legPat[(tick + 4) % 8] * .7, 730, 710);
  rot($('gRose'), rosePat[tick % 12] * .6, 480, 776);
  $('gBodyStatic').setAttribute('transform', `translate(0 ${bobPat[tick % 8] * .6})`);
  rot($('gSmoke'), armPat[tick % 12] * .5, 508, -6);

  /* fumaça sobe: dash escorre em ciclo fechado */
  const dashLen = 150;
  for (const id of ['smoke1','smoke2']){
    const el = $(id);
    el.style.strokeDasharray = '58 92';
    el.style.strokeDashoffset = String(-(t / DUR) * dashLen * 2);
  }

  /* pulso do glow do neon (período 3s) */
  const g = 1 + .14 * Math.sin(2 * Math.PI * t / 3);
  illo.style.filter =
    `drop-shadow(0 0 ${5*g}px rgba(255,255,255,${Math.min(1,.85*g)}))` +
    `drop-shadow(0 0 ${16*g}px rgba(255,255,255,.45))` +
    `drop-shadow(0 0 ${42*g}px rgba(255,255,255,.18))`;

  /* flicker do título */
  title.style.opacity = titleAlpha(t).toFixed(3);

  /* deriva de câmera (período 6s = loop) */
  const s = 1.012 + .009 * Math.sin(2 * Math.PI * t / DUR);
  const ty = 2.5 * Math.sin(2 * Math.PI * t / DUR + Math.PI / 3);
  stage.style.transform = `scale(${s}) translateY(${ty}px)`;

  /* granulação (regenerada a cada tick, determinística) */
  const rnd = mulberry32(1234 + tick);
  const img = gtx.createImageData(270, 338);
  for (let p = 0; p < img.data.length; p += 4){
    const v = rnd() * 255 | 0;
    img.data[p] = img.data[p+1] = img.data[p+2] = v;
    img.data[p+3] = 255;
  }
  gtx.putImageData(img, 0, 0);
}

window.renderFrame = renderFrame;
window.TOTAL_FRAMES = TOTAL;

/* preview ao vivo quando aberto no navegador (sem ?render=1) */
if (!qs.get('render')){
  const t0 = performance.now();
  (function loop(){
    const t = ((performance.now() - t0) / 1000) % DUR;
    renderFrame(Math.floor(t * FPS));
    requestAnimationFrame(loop);
  })();
} else {
  renderFrame(0);
}
</script>
</body>
</html>
