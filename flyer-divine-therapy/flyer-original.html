<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Divine Therapy — flyer original animado</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; }
  body { width:1080px; }

  .page { width:1080px; height:1350px; background:#000; overflow:hidden;
          display:flex; align-items:center; justify-content:center; position:relative; }
  body.story .page { height:1920px; }

  .stage-clip { width:1080px; height:1350px; position:relative; overflow:hidden; background:#000; }
  .stage { width:1080px; height:1350px; position:absolute; inset:0; transform-origin:50% 50%; }

  .flyer { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .smoke-layer { position:absolute; inset:0; width:100%; height:100%; overflow:visible; z-index:3; }
  .wisp { fill:none; stroke:#fff; stroke-linecap:round; }

  #grain { position:absolute; inset:0; z-index:6; pointer-events:none; opacity:.045;
           image-rendering:pixelated; mix-blend-mode:screen; width:100%; height:100%; }
</style>
</head>
<body>
<div class="page">
 <div class="stage-clip">
  <div class="stage" id="stage">

    <img class="flyer" id="flyer" src="arte/flyer-original.png" alt="">

    <svg class="smoke-layer" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- tremido fino só na fumaça, para casar com o traço do flyer -->
        <filter id="smokeBoil" x="-60%" y="-60%" width="220%" height="220%">
          <feTurbulence id="smokeNoise" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <radialGradient id="emberGrad">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="60%" stop-color="#fff" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ancorado na ponta do cigarro; posição vem do CONFIG no script -->
      <g id="gSmoke"
         style="filter:url(#smokeBoil) blur(1.4px) drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 18px rgba(255,255,255,.4));">
        <path id="wisp1" class="wisp" style="stroke-width:5;   opacity:.85" d=""/>
        <path id="wisp2" class="wisp" style="stroke-width:3.6; opacity:.6"  d=""/>
        <path id="wisp3" class="wisp" style="stroke-width:2.8; opacity:.4"  d=""/>
      </g>
      <circle id="ember" r="10" fill="url(#emberGrad)"/>
    </svg>

    <canvas id="grain" width="270" height="338"></canvas>
  </div>
 </div>
</div>

<script>
/* ============================================================
   Flyer original intocado + vida: fumaça no cigarro, brasa
   pulsando, respiração sutil de brilho/zoom e granulação.
   Determinístico: tudo é função do índice do frame.
   FPS=24, DUR=6s -> 144 frames, loop perfeito.
   ============================================================ */
const FPS = 24, DUR = 6, TOTAL = FPS * DUR;
const BOIL_FPS = 8, TICKS = DUR * BOIL_FPS;

const qs = new URLSearchParams(location.search);
if (qs.get('format') === 'story') document.body.classList.add('story');

/* CONFIG: ponta do charuto no flyer original (fração da largura/altura).
   Ajuste fino: abra com ?sx=0.433&sy=0.474 até a fumaça nascer na brasa. */
const SX = parseFloat(qs.get('sx') || '0.429');
const SY = parseFloat(qs.get('sy') || '0.480');
const ox = SX * 1080, oy = SY * 1350;

const $ = id => document.getElementById(id);
const stage = $('stage'), flyer = $('flyer');
const smokeNoise = $('smokeNoise');
const grain = $('grain'), gtx = grain.getContext('2d');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* três véus de fumaça saindo da brasa, comprimentos diferentes;
   sway positivo desvia para a direita, no corredor livre entre
   o AUGUST e o bloco APPOINTMENT */
const WISPS = [
  { id:'wisp1', h:220, sway:24, dash:'110 70', k:2 },
  { id:'wisp2', h:280, sway:38, dash:'90 90',  k:3 },
  { id:'wisp3', h:330, sway:52, dash:'70 110', k:4 },
];
for (const w of WISPS){
  /* curva em S subindo da origem; o sway abre para os lados */
  $(w.id).setAttribute('d',
    `M ${ox},${oy - 6}` +
    ` C ${ox + w.sway},${oy - w.h*0.28} ${ox - w.sway},${oy - w.h*0.52} ${ox + w.sway*0.7},${oy - w.h*0.76}` +
    ` C ${ox + w.sway*1.3},${oy - w.h*0.9} ${ox + w.sway*0.4},${oy - w.h*0.97} ${ox + w.sway*0.9},${oy - w.h}`);
}
$('ember').setAttribute('cx', ox); $('ember').setAttribute('cy', oy);

function renderFrame(i){
  const t = (i % TOTAL) / FPS;
  const tick = Math.floor(t * BOIL_FPS) % TICKS;

  /* fumaça: tremido a 8fps + véus escorrendo para cima */
  smokeNoise.setAttribute('seed', String(tick + 1));
  for (const w of WISPS){
    const el = $(w.id);
    const [a, b] = w.dash.split(' ').map(Number);
    el.style.strokeDasharray = w.dash;
    el.style.strokeDashoffset = String(-(t / DUR) * (a + b) * w.k);
  }

  /* balanço lateral suave do véu (período 3s) */
  $('gSmoke').setAttribute('transform',
    `rotate(${2.2 * Math.sin(2 * Math.PI * t / 3)} ${ox} ${oy})`);

  /* brasa pulsando (período 1.5s) */
  const e = .55 + .45 * Math.sin(2 * Math.PI * t / 1.5);
  $('ember').style.opacity = (0.35 + 0.65 * e).toFixed(3);
  $('ember').setAttribute('r', String(8 + 4 * e));

  /* respiração de brilho do flyer (período 3s, bem sutil) */
  flyer.style.filter = `brightness(${(1 + .03 * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / 3))).toFixed(4)})`;

  /* deriva de câmera (período 6s = loop) */
  const s = 1.008 + .008 * Math.sin(2 * Math.PI * t / DUR);
  const ty = 2 * Math.sin(2 * Math.PI * t / DUR + Math.PI / 3);
  stage.style.transform = `scale(${s}) translateY(${ty}px)`;

  /* granulação determinística a 8fps */
  const rnd = mulberry32(1234 + tick);
  const img = gtx.createImageData(270, 338);
  for (let p = 0; p < img.data.length; p += 4){
    const v = rnd() * 255 | 0;
    img.data[p] = img.data[p+1] = img.data[p+2] = v;
    img.data[p+3] = 255;
  }
  gtx.putImageData(img, 0, 0);
}

window.renderFrame = renderFrame;
window.TOTAL_FRAMES = TOTAL;

if (!qs.get('render')){
  const t0 = performance.now();
  (function loop(){
    const t = ((performance.now() - t0) / 1000) % DUR;
    renderFrame(Math.floor(t * FPS));
    requestAnimationFrame(loop);
  })();
} else {
  renderFrame(0);
}
</script>
</body>
</html>
